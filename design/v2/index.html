<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TripMate</title>
<meta name="theme-color" content="#FAF8F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   TripMate

   Stil: «Accent ladder», delt ut av taste-skill (frø 1132880137).
   Én merkefarge i full styrke bare på små merker; de bleke tonene
   gjør alt arealarbeidet. Arket sier selv at stigen skal bygges av
   merkets egen farge — her oransjen fra logoen.

   Fargene er hentet ut av logofila, ikke gjettet:
   djupblå #103541, oransje #F06629.
   ═══════════════════════════════════════════════════════════════ */

:root{
  /* ── stigen, bygget av merkeoransjen ───────────────────────── */
  --merke:#F06629;          /* full styrke: bare små merker */
  --merke-blek:#FEF1E8;     /* areal: kort, striper, felter */
  --merke-spor:#FAD9C2;     /* spor og kanter i familien */
  --merke-blekk:#8C3A0C;    /* tekst som står på den bleke tonen */

  /* ── blekk: merkets djupblå gjør jobben som tekstfarge ────── */
  --blekk:#103541;
  --blekk-2:#4A6069;
  --blekk-3:#5F7379;        /* 4,7:1 mot den varme grunnen; #6E8189 ga 3,9 */

  --grunn:#FAF8F6;          /* ett hakk mot den bleke tonen */
  --flate:#FFFFFF;
  --kant:#EAE4DF;
  --strek:#F1ECE8;

  --fare:#B3261E;
  --fare-blek:#FCEDEC;
  --god:#1E6B4E;

  /* ── form: det tette paret, 8 og 6 ─────────────────────────── */
  --r-kort:14px;
  --r-flate:10px;
  --r-kontroll:999px;

  --marg:20px;
  --gap:14px;

  --fs-tittel:27px;
  --fs-seksjon:15px;
  --fs-brod:16px;     /* arket sier 14; en telefon i sollys sier 16 */
  --fs-sub:13.5px;
  --fs-liten:12px;

  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);

  /* ── bevegelse ─────────────────────────────────────────────
     Kurvene er hentet, ikke funnet på. De innebygde er for svake. */
  --ease-ut:cubic-bezier(0.23, 1, 0.32, 1);
  --ease-begge:cubic-bezier(0.77, 0, 0.175, 1);
  --ease-skuff:cubic-bezier(0.32, 0.72, 0, 1);
  --t-trykk:120ms;
  --t-liten:160ms;
  --t-skjerm:140ms;
  --t-meny:260ms;

  color-scheme:light;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:"DM Sans",-apple-system,system-ui,sans-serif;
  font-size:var(--fs-brod);line-height:1.45;color:var(--blekk);background:var(--grunn);
  -webkit-text-size-adjust:100%;overflow:hidden;font-variant-numeric:tabular-nums;
  -webkit-tap-highlight-color:transparent;
}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--merke);outline-offset:2px;border-radius:8px}

/* Trykkrespons på alt som kan trykkes. 120 ms, bare transform. */
button{transition:transform var(--t-trykk) var(--ease-ut)}
button:active{transform:scale(.97)}

/* ── stillas rundt prototypen (ikke en del av appen) ───────────── */
.ramme{display:flex;flex-direction:column;height:100dvh;background:#0B2029}
.telefon{
  flex:1;min-height:0;width:100%;max-width:412px;margin:0 auto;background:var(--grunn);
  display:flex;flex-direction:column;position:relative;overflow:hidden;
}
@media (min-width:480px){
  .ramme{padding:16px 0}
  .telefon{border-radius:28px;max-height:880px;box-shadow:0 24px 70px rgba(0,0,0,.5)} /* taste-skill-ignore: stillas */
}
.notat{
  flex:none;padding:10px 16px calc(10px + var(--safe-b));background:#0B2029;
  color:#7D959E;font-size:12px;text-align:center;line-height:1.5;
}
.notat b{color:#D7E3E7;font-weight:500}

/* ── merket ────────────────────────────────────────────────────── */
.merkeT{width:22px;height:22px;flex:none;display:block}
.ordmerke{display:flex;align-items:center;gap:7px;min-width:0}
.ordmerke .navn{font-size:17px;font-weight:700;letter-spacing:-.02em}
.ordmerke .navn em{font-style:normal;color:var(--merke)}

/* ── toppbar ───────────────────────────────────────────────────── */
.topp{
  flex:none;display:flex;align-items:center;gap:10px;height:52px;
  padding:0 12px 0 var(--marg);margin-top:var(--safe-t);
}
.turknapp{
  flex:1;min-width:0;display:flex;align-items:center;gap:6px;border:0;background:none;
  padding:6px 4px 6px 0;cursor:pointer;text-align:left;min-height:44px;
}
.turknapp .nv{font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.turknapp .kryss{width:15px;height:15px;flex:none;stroke:var(--blekk-3);fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;transition:transform var(--t-meny) var(--ease-ut)}
.turknapp[aria-expanded="true"] .kryss{transform:rotate(180deg)}
.meg-knapp{
  width:44px;height:44px;flex:none;border:0;background:none;padding:0;cursor:pointer;
  display:grid;place-items:center;position:relative;color:var(--blekk-2);
}
.meg-knapp .sirkel{
  width:32px;height:32px;border-radius:50%;background:var(--merke-blek);color:var(--merke-blekk);
  font-size:12px;font-weight:600;display:grid;place-items:center;
}
.meg-knapp svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.meg-knapp .prikk{position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;
  background:var(--merke);border:2px solid var(--grunn)}

/* ── skjerm ────────────────────────────────────────────────────── */
.rull{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.rull::-webkit-scrollbar{display:none}
.inn{padding:0 var(--marg)}
.luft{height:30px}

/* Skjermbytte: 140 ms, bare opacity og transform. Nok til å unngå
   at innholdet teleporterer, for lite til å merkes som en animasjon
   når du bytter fane tjue ganger om dagen. */
@keyframes skjerm-inn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.skjerm-anim{animation:skjerm-inn var(--t-skjerm) var(--ease-ut)}

h1.tittel{font-size:var(--fs-tittel);font-weight:700;letter-spacing:-.025em;line-height:1.15;margin:8px 0 0}
.underlinje{font-size:var(--fs-sub);color:var(--blekk-2);margin-top:5px}

/* ── dagstripa: TripMates eget element ─────────────────────────── */
/* Logoens oransje prikk er «nå». Det er den samme prikken som sitter
   på T-en — merket og tidspunktet er den samme tingen. */
.stripe{margin:20px 0 0;position:relative}
.stripe .akse{position:absolute;left:0;right:0;top:20px;height:2px;background:var(--strek);border-radius:2px}
.stripe .gaatt{position:absolute;left:0;top:20px;height:2px;background:var(--merke-spor);border-radius:2px;
  transform-origin:left;transition:transform 600ms var(--ease-begge)}
.stripe .punkter{display:flex;justify-content:space-between;position:relative}
.stripe .pk{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:0}
.stripe .kl{font-size:var(--fs-liten);color:var(--blekk-3)}
.stripe .mk{width:9px;height:9px;border-radius:50%;background:var(--kant);flex:none}
.stripe .pk.ferdig .mk{background:var(--merke-spor)}
.stripe .pk.aktiv .mk{
  width:14px;height:14px;background:var(--merke);
  box-shadow:0 0 0 5px var(--merke-blek); /* taste-skill-ignore: ring, ikke skygge */
}
.stripe .pk.aktiv .kl{color:var(--merke-blekk);font-weight:600}
.stripe .nvn{font-size:12px;color:var(--blekk-3);text-align:center;line-height:1.25;max-width:70px;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.stripe .pk.aktiv .nvn{color:var(--blekk)}
/* Prikken setter seg på plass én gang når skjermen åpnes. Den pulser
   ikke: et merke som beveger seg hele dagen er støy, ikke informasjon. */
@keyframes prikk-inn{from{transform:scale(.4);box-shadow:0 0 0 0 var(--merke-blek)} /* taste-skill-ignore: ringen rundt prikken, ikke en skygge */
  to{transform:scale(1);box-shadow:0 0 0 5px var(--merke-blek)}} /* taste-skill-ignore */
.skjerm-anim .stripe .pk.aktiv .mk{animation:prikk-inn 320ms var(--ease-ut) 60ms backwards}

/* ── «nå»-kortet: blek tone gjør arealet, full farge bare merket ── */
.naakort{
  margin-top:18px;background:var(--merke-blek);border-radius:var(--r-kort);padding:18px;
  position:relative;overflow:hidden;
}
.naakort .merk{
  display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-liten);font-weight:600;
  color:var(--merke-blekk);margin-bottom:8px;
}
.naakort .merk i{width:7px;height:7px;border-radius:50%;background:var(--merke);display:block}
.naakort .kl{font-size:38px;font-weight:700;line-height:1;letter-spacing:-.035em}
.naakort .hva{font-size:19px;font-weight:600;margin-top:6px;letter-spacing:-.015em}
.naakort .hvor{font-size:var(--fs-sub);color:var(--merke-blekk);opacity:.82;margin-top:2px}
.naakort .knapper{display:flex;gap:8px;margin-top:16px}

.btn{
  flex:1;min-height:46px;border-radius:var(--r-kontroll);border:1px solid var(--kant);
  background:var(--flate);color:var(--blekk);font-size:15px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* Hovedhandlingen er blekk, ikke oransje: hvit tekst på #F06629 gir
   3,2:1, og det er under kravet. Oransjen beholder jobben som merke. */
.btn.primar{background:var(--blekk);border-color:var(--blekk);color:#fff}

/* ── ruter ─────────────────────────────────────────────────────── */
.ruter{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.rute{
  text-align:left;border:1px solid var(--kant);background:var(--flate);border-radius:var(--r-flate);
  padding:13px;cursor:pointer;min-height:78px;display:flex;flex-direction:column;justify-content:space-between;
}
.rute .nv{font-size:15px;font-weight:600}
.rute .vr{font-size:var(--fs-sub);color:var(--blekk-2);margin-top:3px}
.rute .vr b{font-weight:700;color:var(--blekk)}
.merkelapp{
  display:inline-block;background:var(--merke-blek);color:var(--merke-blekk);border-radius:var(--r-kontroll);
  font-size:11.5px;font-weight:600;padding:1px 8px;margin-left:6px;
}

/* ── seksjoner og rader ────────────────────────────────────────── */
.bolk{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 2px}
.bolk h3{font-size:var(--fs-seksjon);font-weight:600;margin:0;letter-spacing:-.01em}
.bolk .lenke{font-size:13.5px;font-weight:500;color:var(--merke-blekk);background:none;border:0;
  cursor:pointer;padding:13px 0;margin:-13px 0;min-height:44px}

.post{
  display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:baseline;
  padding:13px 0;border-bottom:1px solid var(--strek);width:100%;text-align:left;
  background:none;border-left:0;border-right:0;border-top:0;cursor:pointer;
}
.post:last-of-type{border-bottom:0}
.post .t{font-size:14.5px;font-weight:500;color:var(--blekk-2)}
.post .h{display:block;font-size:var(--fs-brod);font-weight:500}
.post .s{display:block;font-size:var(--fs-sub);color:var(--blekk-2);margin-top:2px}
.post.ferdig .t,.post.ferdig .h{color:var(--blekk-3)}
.post.ferdig .h{text-decoration:line-through;text-decoration-color:var(--kant)}
.post .pil{color:var(--blekk-3)}
.post .pil svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── dagvelger ─────────────────────────────────────────────────── */
.dager{display:flex;gap:8px;overflow-x:auto;padding:12px var(--marg) 4px;scrollbar-width:none}
.dager::-webkit-scrollbar{display:none}
.dag{
  flex:none;border:1px solid var(--kant);background:var(--flate);border-radius:var(--r-flate);
  padding:8px 12px;cursor:pointer;text-align:center;min-width:54px;min-height:54px;
  transition:background var(--t-liten) var(--ease-ut),border-color var(--t-liten) var(--ease-ut),
             color var(--t-liten) var(--ease-ut),transform var(--t-trykk) var(--ease-ut);
}
.dag .d{font-size:var(--fs-liten);color:var(--blekk-2);transition:color var(--t-liten) var(--ease-ut)}
.dag .n{font-size:17px;font-weight:600;line-height:1.2}
.dag[aria-selected="true"]{background:var(--merke-blek);border-color:var(--merke-spor);color:var(--merke-blekk)}
.dag[aria-selected="true"] .d{color:var(--merke-blekk)}
.dag .idag{display:block;width:5px;height:5px;border-radius:50%;background:var(--merke);margin:3px auto 0}

/* ── fanelinje ─────────────────────────────────────────────────── */
.faner{
  flex:none;display:flex;border-top:1px solid var(--strek);background:var(--grunn);
  padding:6px 8px calc(6px + var(--safe-b));
}
.fane{
  flex:1;border:0;background:none;cursor:pointer;color:var(--blekk-3);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 0 3px;min-height:48px;font-size:11.5px;font-weight:500;position:relative;
  transition:color var(--t-liten) var(--ease-ut);
}
.fane svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
  transition:transform var(--t-liten) var(--ease-ut)}
.fane[aria-selected="true"]{color:var(--merke-blekk)}
/* Ikonet løfter seg to piksler. Nok til å kjennes, for lite til å se. */
.fane[aria-selected="true"] svg{transform:translateY(-2px)}
.fane .tall{
  position:absolute;top:3px;left:50%;margin-left:4px;background:var(--merke);color:#fff;
  border-radius:var(--r-kontroll);font-size:10.5px;font-weight:700;padding:0 5px;min-width:18px;line-height:18px;text-align:center;
}

/* ── rullegardin ───────────────────────────────────────────────── */
.slor{
  position:absolute;inset:0;background:rgba(16,53,65,.4);z-index:8;border:0;width:100%;
  opacity:0;transition:opacity var(--t-meny) var(--ease-ut);
}
.slor.vis{opacity:1}
.gardin{
  position:absolute;left:0;right:0;top:0;z-index:9;background:var(--flate);
  border-radius:0 0 var(--r-kort) var(--r-kort);padding:calc(12px + var(--safe-t)) 0 10px;
  box-shadow:0 20px 44px -26px rgba(16,53,65,.6); /* taste-skill-ignore: ekte overlegg */
  transform:translateY(-100%);transition:transform var(--t-meny) var(--ease-skuff);
}
.gardin.vis{transform:none}
.gardin .hode{display:flex;align-items:center;gap:9px;padding:2px var(--marg) 0}
.gardin .tit{font-size:16px;font-weight:700;letter-spacing:-.015em}
.gardin .sub{font-size:var(--fs-sub);color:var(--blekk-2);padding:1px var(--marg) 10px;margin-left:31px}
.mrad{
  display:flex;align-items:center;gap:13px;width:100%;border:0;background:none;
  padding:11px var(--marg);text-align:left;cursor:pointer;min-height:48px;
}
.mrad svg{width:19px;height:19px;flex:none;stroke:var(--blekk-2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mrad .nv{flex:1;font-size:15.5px;font-weight:500}
.mrad .vr{font-size:var(--fs-sub);color:var(--blekk-3);font-weight:400}
.mrad[aria-current="true"]{background:var(--merke-blek)}
.mrad[aria-current="true"] svg{stroke:var(--merke-blekk)}
.mrad .tall{background:var(--merke);color:#fff;border-radius:var(--r-kontroll);font-size:11.5px;font-weight:700;padding:1px 8px}
.mskille{height:1px;background:var(--strek);margin:8px var(--marg)}

/* ── lister ────────────────────────────────────────────────────── */
.rad{
  display:flex;align-items:center;gap:13px;width:100%;padding:12px 0;text-align:left;
  border:0;border-bottom:1px solid var(--strek);background:none;cursor:pointer;min-height:56px;
}
.rad:last-of-type{border-bottom:0}
.rad .nv{display:block;font-size:var(--fs-brod);font-weight:500}
.rad .s{display:block;font-size:var(--fs-sub);color:var(--blekk-2);margin-top:1px}
.rad .grow{flex:1;min-width:0}
.filtype{
  width:34px;height:42px;flex:none;border:1px solid var(--kant);border-radius:6px;
  display:grid;place-items:center;font-size:9.5px;font-weight:600;color:var(--blekk-2);background:var(--flate);
}
.init{
  width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;
  font-size:12.5px;font-weight:600;color:var(--merke-blekk);background:var(--merke-blek);
}

/* Avkryssing: boksen fylles og haken tegnes. 180 ms, og teksten
   dempes samtidig — ett trykk, én samlet beskjed. */
.hake{
  width:26px;height:26px;flex:none;border:1.8px solid var(--kant);border-radius:8px;
  display:grid;place-items:center;background:var(--flate);
  transition:background var(--t-liten) var(--ease-ut),border-color var(--t-liten) var(--ease-ut);
}
.hake svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset 180ms var(--ease-ut) 40ms}
.rad.av .hake{background:var(--merke);border-color:var(--merke)}
.rad.av .hake svg{stroke-dashoffset:0}
.rad .nv{transition:color var(--t-liten) var(--ease-ut)}
.rad.av .nv{color:var(--blekk-3);text-decoration:line-through;text-decoration-color:var(--kant)}

/* ── seter ─────────────────────────────────────────────────────── */
.setekart{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
.gang{grid-column:1/-1;height:12px;display:grid;place-items:center}
.gang span{font-size:10.5px;color:var(--blekk-3)}
.sete{
  border:1px solid var(--kant);background:var(--flate);border-radius:var(--r-flate);
  min-height:54px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;
  transition:background var(--t-liten) var(--ease-ut),border-color var(--t-liten) var(--ease-ut),
             color var(--t-liten) var(--ease-ut),transform var(--t-liten) var(--ease-ut);
}
.sete .n{font-size:13.5px;font-weight:600}
.sete .hvem{font-size:10.5px;color:var(--blekk-3);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sete.tatt{background:var(--grunn);color:var(--blekk-3);cursor:default}
.sete.min{background:var(--merke);border-color:var(--merke);color:#fff}
.sete.min .hvem{color:rgba(255,255,255,.85)}
/* Setet du nettopp tok: ett løft, 220 ms. Skjer én gang per tur. */
@keyframes sete-tatt{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.sete.nytt{animation:sete-tatt 220ms var(--ease-ut)}

/* ── chat ──────────────────────────────────────────────────────── */
.meldinger{display:flex;flex-direction:column;gap:14px;padding:16px var(--marg) 8px;margin-top:auto}
.melding{max-width:84%;display:flex;flex-direction:column;gap:3px}
.melding.min{align-self:flex-end;align-items:flex-end}
.hvem{font-size:var(--fs-liten);color:var(--blekk-2);padding-left:2px;font-weight:500}
.boble{background:var(--flate);border:1px solid var(--kant);border-radius:16px 16px 16px 6px;
  padding:10px 13px;font-size:15.5px;overflow-wrap:anywhere}
.melding.min .boble{background:var(--merke-blek);border-color:var(--merke-spor);color:var(--merke-blekk);
  border-radius:16px 16px 6px 16px}
.stempel{font-size:11.5px;color:var(--blekk-3);padding:0 3px}
.skriv{
  flex:none;display:flex;gap:9px;align-items:flex-end;padding:10px var(--marg) calc(10px + var(--safe-b));
  border-top:1px solid var(--strek);background:var(--grunn);
}
.skriv input{
  flex:1;min-width:0;min-height:46px;border:1px solid var(--kant);background:var(--flate);
  border-radius:var(--r-kontroll);padding:12px 16px;font-size:16px;
}
.ikonknapp{
  width:46px;height:46px;flex:none;border-radius:50%;border:1px solid var(--kant);
  background:var(--flate);cursor:pointer;display:grid;place-items:center;color:var(--blekk-2);
}
.ikonknapp.send{background:var(--blekk);border-color:var(--blekk);color:#fff}
.ikonknapp svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.tomt{padding:36px 0;text-align:center;color:var(--blekk-2);font-size:var(--fs-sub)}

/* Rader som forsvinner (godkjent, avslått): ut samme vei som alt
   annet — opacity og transform, aldri height. */
.gaar-ut{opacity:0;transform:translateY(-6px);transition:opacity 200ms var(--ease-ut),transform 200ms var(--ease-ut)}

/* ── beskjed ───────────────────────────────────────────────────── */
/* Overgang, ikke keyframes: den kan fyres av to ganger på et sekund,
   og da skal den sikte fra der den er, ikke starte på nytt. */
.beskjed{
  position:absolute;left:50%;bottom:84px;z-index:12;
  background:var(--blekk);color:#fff;border-radius:var(--r-kontroll);padding:10px 16px;
  font-size:13.5px;font-weight:500;white-space:nowrap;max-width:88%;overflow:hidden;text-overflow:ellipsis;
  transform:translate(-50%,8px);opacity:0;pointer-events:none;
  transition:opacity 200ms var(--ease-ut),transform 200ms var(--ease-ut);
}
.beskjed.vis{opacity:1;transform:translate(-50%,0)}

/* ══ glass: iPhone, lagt til på hjemskjermen ═══════════════════ */
@supports (backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)) { /* taste-skill-ignore */
  html.glass .telefon{--glass-tint:rgba(250,248,246,.72)}
  @media (max-width:479px){ html.glass .telefon{overflow:visible} }

  html.glass .topp,html.glass .faner{
    position:absolute;left:0;right:0;z-index:5;background:var(--glass-tint);
    -webkit-backdrop-filter:saturate(1.9) blur(26px); /* taste-skill-ignore */
    backdrop-filter:saturate(1.9) blur(26px); /* taste-skill-ignore */
  }
  html.glass .topp{top:0;margin-top:0;padding-top:var(--safe-t);height:auto;min-height:52px}
  /* Apple: «a tab bar floats above content». Den er en kapsel, ikke en
     stripe fra kant til kant. */
  html.glass .faner{
    left:10px;right:10px;bottom:calc(9px + var(--safe-b));
    border:1px solid rgba(255,255,255,.7);border-radius:24px;padding:6px;
    background:rgba(250,248,246,.82);
    box-shadow:0 10px 26px -12px rgba(16,53,65,.35); /* taste-skill-ignore */
  }
  html.glass .fane[aria-selected="true"]{background:var(--merke-blek);border-radius:18px}
  html.glass .gardin{padding-top:calc(12px + var(--safe-t))}
}
@media (prefers-reduced-transparency:reduce){
  html.glass .topp,html.glass .faner{
    background:var(--grunn);
    -webkit-backdrop-filter:none; /* taste-skill-ignore */
    backdrop-filter:none; /* taste-skill-ignore */
  }
}

/* ══ mindre bevegelse: behold det som forklarer, fjern det som flytter ══ */
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important}
  .skjerm-anim{animation:none}
  .gardin{transition:opacity var(--t-liten) linear;transform:none;opacity:0}
  .gardin.vis{opacity:1}
  .stripe .gaatt{transition:none}
  button:active{transform:none}
}
</style>

<body>

<div class="ramme">

<script>
/* ═══ merket: T-en med flystreken og den oransje prikken ═══ */
const MERKE = (farge = "var(--blekk)") => `

/* ═══ data ═══ */
const TUR = { navn:"Brussel, Paris og Normandie", klasse:"Tryggheim VG2", dager:8 };

const DAGER = [

    { t:"18:00", h:"Middag og innsjekk", kort:"Middag", s:"Hotel Bedford", ferdig:true }

  { kort:"tor", num:"18.", navn:"Torsdag 18. september", idag:true, punkter:[

  ["15A",""],["15B",""],["15C","Sara"],["15D",""], null,
  ["16A",""],["16B",""],["16C",""],["16D",""]

const S = {
  dag: IDAG, kryss: new Set(["Pass","Helsetrygdkort","Regnjakke","Lader og powerbank"]),
  sete: "14B", nyttSete: null, ventende: true, antall: 28, menyAapen: false, gardinLukker: false

const esc = s => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PROGRAM = () => DAGER[IDAG].punkter;
const ANTALL_PAKK = PAKKELISTE.flatMap(b => b[1]).length;

/* ═══ deler ═══ */
const topp = () => `
  <header class="topp">

    </button>
    <button class="meg-knapp" data-gaa="meg" aria-label="Din profil">
      <span class="sirkel">JR</span><span class="prikk"></span></button>
  </header>`;

const faner = (aktiv) => {
  const f = [["hjem","I dag",I.hjem],["program","Program",I.program],["chat","Chat",I.chat,3],["meg","Meg",I.meg]];
  return `<nav class="faner" role="tablist">${f.map(([id,navn,ikon,n]) => `
    <button class="fane" role="tab" data-gaa="${id}" aria-selected="${aktiv===id}">
      ${ikon}${n?`<span class="tall">${n}</span>`:""}<span>${navn}</span>
    </button>`).join("")}</nav>`;
};

const stripe = () => {
  const p = PROGRAM();
  const naaIdx = p.findIndex(x => x.naa);
  const andel = p.length > 1 ? (naaIdx / (p.length - 1)) * 100 : 0;
  return `
  <div class="stripe" aria-label="Dagen i oversikt">
    <div class="akse"></div>
    <div class="gaatt" style="right:0;transform:scaleX(${(andel/100).toFixed(3)})"></div>
    <div class="punkter">
      ${p.map(x => `
        <div class="pk ${x.ferdig?"ferdig":""} ${x.naa?"aktiv":""}">
          <span class="kl">${x.t}</span><span class="mk"></span><span class="nvn">${esc(x.kort)}</span>

    </div>
  </div>`;
};

      <button class="rad" data-apne="${esc(n)}"><span class="filtype">${t}</span>

    ${[["PNG","Kart over Montmartre.png","Ada · i går"],
       ["PDF","Billetter Disneyland.pdf","Marit · 14. sep"],

const MENY = () => [
  ["hjem","I dag","",I.hjem],
  ["program","Program","",I.program],
  ["chat","Chat","",I.chat,3],
  ["filer","Filer","7 stk.",I.fil],
  ["pakkeliste","Pakkeliste",`${S.kryss.size} av ${ANTALL_PAKK}`,I.sekk],
  ["sitteplasser","Sitteplasser","Sete "+S.sete,I.sete],
  ["deltakere","Deltakere",S.antall+" med",I.folk,S.ventende?1:0],
  null,
  ["meg","Innstillinger","",I.tann],
  ["bytt","Bytt tur","",I.bytt]
];

function gardinHtml() {
  return `
    <button class="slor" data-gaa="lukk" aria-label="Lukk menyen"></button>
    <div class="gardin" role="dialog" aria-label="Meny">
      <div class="hode">${MERKE()}<span class="tit">TripMate</span></div>
      <div class="sub">${esc(TUR.navn)} · ${esc(TUR.klasse)}</div>
      ${MENY().map(m => {
        if (!m) return '<div class="mskille"></div>';
        const [id,navn,verdi,ikon,tall] = m;
        return `<button class="mrad" data-gaa="${id}" ${id===naavaerende?'aria-current="true"':""}>
          ${ikon}<span class="nv">${navn}${verdi?` <span class="vr">· ${verdi}</span>`:""}</span>
          ${tall?`<span class="tall">${tall}</span>`:""}</button>`;
      }).join("")}
    </div>`;
}

/* ═══ motor ═══ */
let naavaerende = "hjem", forrige = "hjem";
const tlf = document.getElementById("telefon");
const notat = document.getElementById("notat");

const NOTATER = {
  hjem:"<b>I dag.</b> Logoens oransje prikk er «nå» i dagstripa — merket og tidspunktet er samme ting.",
  program:"<b>Program.</b> Dagen med prikk under er i dag. Tomme dager står tomme, ikke skjult.",
  chat:"<b>Chat.</b> Navnet står i blekk, ikke grått: identitet skal aldri bleknes bort.",
  samtale:"<b>Samtale.</b> Dine egne meldinger bruker den bleke merketonen, ikke full oransje.",
  sitteplasser:"<b>Sitteplasser.</b> Ditt sete er det eneste med full merkefarge på skjermen.",
  pakkeliste:"<b>Pakkeliste.</b> Haken tegnes, den dukker ikke opp ferdig.",
  filer:"<b>Filer.</b> Filtypen står som tekst, ikke som et farget ikon i en boks.",
  deltakere:"<b>Deltakere.</b> Den som venter står øverst. Svarer du, glir raden ut.",
  meg:"<b>Meg.</b> Det som haster står først, med merkelappen i merketonen.",
  meny:"<b>Rullegardinen.</b> Faller ned med skuffkurven, 260 ms. Trykk utenfor for å lukke.",
  chatside:"<b>Om chatten.</b> Du kom hit ved å trykke på navnet øverst i samtalen."
};

function maalOppStripene() {
  const topp = tlf.querySelector(".topp"), faner = tlf.querySelector(".faner");
  const paa = document.documentElement.classList.contains("glass");
  tlf.querySelectorAll(".rull, .inn, .dager, .meldinger").forEach(el => {
    el.style.paddingTop = ""; el.style.paddingBottom = "";
  });
  if (!paa || !topp) return;
  const etter = topp.nextElementSibling;
  if (etter) etter.style.paddingTop = topp.offsetHeight + "px";
  if (faner) {
    const rull = tlf.querySelector(".rull");
    const under = tlf.getBoundingClientRect().bottom - faner.getBoundingClientRect().bottom;
    if (rull) rull.style.paddingBottom = Math.round(faner.offsetHeight + under * 2) + "px";
  }
}

const ERIPHONE = /iPhone|iPad|iPod/.test(navigator.userAgent);
const PAAHJEMSKJERM = window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
const KANUSKARPHET = CSS.supports("backdrop-filter","blur(1px)") || CSS.supports("-webkit-backdrop-filter","blur(1px)");
function settGlass(paa){ document.documentElement.classList.toggle("glass", Boolean(paa) && KANUSKARPHET); }
settGlass(ERIPHONE && PAAHJEMSKJERM);

function tegn(behold) {
  const vis = naavaerende === "meny" ? forrige : naavaerende;
  tlf.innerHTML = (SKJERM[vis] || SKJERM.hjem)();
  if (S.menyAapen || S.gardinLukker) {
    tlf.insertAdjacentHTML("beforeend", gardinHtml());
    const g = tlf.querySelector(".gardin"), s = tlf.querySelector(".slor");
    if (S.gardinLukker) {
      // Den lukker: tegn den åpen med én gang, så den har noe å gli fra.
      if (g) g.classList.add("vis");
      if (s) s.classList.add("vis");
    } else {
      // Den åpner: to bilder, ellers er det ingenting å gli fra.
      requestAnimationFrame(() => requestAnimationFrame(() => {
        if (g) g.classList.add("vis");
        if (s) s.classList.add("vis");
      }));
    }
  }
  maalOppStripene();
  const paa = document.documentElement.classList.contains("glass");
  notat.innerHTML = (NOTATER[naavaerende] || "")
    + ` <button id="glassbryter" style="margin-left:6px;border:1px solid #2A4751;background:${paa?"#D7E3E7":"transparent"};`
    + `color:${paa?"#0B2029":"#7D959E"};border-radius:999px;padding:2px 9px;font-size:11px;cursor:pointer">`
    + `Glass ${paa?"på":"av"}</button>`;
  const r = tlf.querySelector(".rull");
  if (r && behold !== undefined) r.scrollTop = behold;
  S.nyttSete = null;
}

let beskjedtimer = null;
function si(tekst) {
  let b = tlf.querySelector(".beskjed");
  if (!b) { b = document.createElement("div"); b.className = "beskjed"; b.setAttribute("role","status"); tlf.appendChild(b); }
  b.textContent = tekst;
  requestAnimationFrame(() => b.classList.add("vis"));
  clearTimeout(beskjedtimer);
  beskjedtimer = setTimeout(() => {
    b.classList.remove("vis");
    setTimeout(() => b.remove(), 220);
  }, 1700);
}

/* Menyen går ut samme vei som den kom inn. Men navigasjonen venter
   ikke på den: trykker du «Filer», er Filer der med én gang, og
   gardinen glir av oppå den nye skjermen. Å vente 240 ms på en
   animasjon før noe skjer er det motsatte av responsivt. */
function skyvGardinenUt() {
  requestAnimationFrame(() => {
    const g = tlf.querySelector(".gardin"), s = tlf.querySelector(".slor");
    if (g) g.classList.remove("vis");
    if (s) s.classList.remove("vis");
    setTimeout(() => {
      S.gardinLukker = false;
      const g2 = tlf.querySelector(".gardin"), s2 = tlf.querySelector(".slor");
      if (g2) g2.remove();
      if (s2) s2.remove();
    }, 280);
  });
}

function lukkMeny() {
  if (!S.menyAapen && !S.gardinLukker) return;
  S.menyAapen = false;
  S.gardinLukker = true;
  naavaerende = forrige;
  tegn();
  skyvGardinenUt();
}

function velgFraMeny(mal) {
  S.menyAapen = false;
  S.gardinLukker = true;
  naavaerende = mal;
  tegn();                 // den nye skjermen er der nå, ikke om 240 ms
  skyvGardinenUt();
}

tlf.addEventListener("click", e => {
  const k = e.target.closest("[data-gaa],[data-dag],[data-kryss],[data-sete],[data-svar],[data-apne]");
  if (!k) {
    const rad = e.target.closest("button.rad, button.post");
    if (rad) { const n = (rad.querySelector(".nv, .h")||{}).textContent; si(n ? "«"+n.trim()+"» åpnes her" : "Ikke tegnet ennå"); }
    return;
  }
  const d = k.dataset;

  if (d.gaa) {
    if (d.gaa === "lukk") return lukkMeny();
    if (d.gaa === "meny") {
      if (S.menyAapen) return lukkMeny();
      forrige = naavaerende; S.menyAapen = true; naavaerende = "meny"; return tegn();
    }
    if (d.gaa === "bytt") { lukkMeny(); return si("Du har bare én tur akkurat nå."); }
    if (SKJERM[d.gaa]) {
      if (S.menyAapen) return velgFraMeny(d.gaa);
      naavaerende = d.gaa; tegn();
    }
    return;
  }

  if (d.dag !== undefined) { S.dag = Number(d.dag); return tegn(); }

  if (d.kryss !== undefined) {
    S.kryss.has(d.kryss) ? S.kryss.delete(d.kryss) : S.kryss.add(d.kryss);
    const r = tlf.querySelector(".rull");
    return tegn(r ? r.scrollTop : 0);
  }

  if (d.sete) {
    if (d.opptatt === "1") return si("Setet er tatt.");
    if (d.sete === S.sete) return;
    S.sete = d.sete; S.nyttSete = d.sete;
    const r = tlf.querySelector(".rull");
    tegn(r ? r.scrollTop : 0);
    return si("Du har sete " + d.sete + " nå.");
  }

  if (d.svar) {
    const boks = tlf.querySelector("#ventende");
    const ja = d.svar === "ja";
    if (boks) {
      boks.classList.add("gaar-ut");
      setTimeout(() => {
        S.ventende = false;
        if (ja) S.antall += 1;
        tegn();
        si(ja ? "Emma er med på turen." : "Emma fikk avslag.");
      }, 200);
    }
    return;
  }

  if (d.apne) return si(d.apne);
});

addEventListener("resize", maalOppStripene);
addEventListener("orientationchange", () => setTimeout(maalOppStripene, 200));

notat.addEventListener("click", e => {
  if (e.target.id !== "glassbryter" || !KANUSKARPHET) return;
  settGlass(!document.documentElement.classList.contains("glass"));
  tegn();
});

tegn();
</script>
</body>
</html>
